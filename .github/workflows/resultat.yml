# Hämtar tävlingsresultat och cupställningar automatiskt och sparar dem i
# data/resultat-<säsong>.json. Körs var 20:e minut (GitHub kan försena körningarna en stund).
name: Hämta resultat

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch: {}
  push:
    branches: [resultat-test]

permissions:
  contents: write

concurrency:
  group: resultat
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hämta resultat
        run: node scripts/hamta-resultat.mjs
        env:
          RESULTAT_SASONG: ${{ github.ref_name == 'resultat-test' && '2025-26' || '' }}
      - name: Spara om något ändrats
        run: |
          git config user.name "skidor-resultat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resultat-*.json
          if git diff --cached --quiet; then
            echo "Inget nytt att spara."
          else
            git commit -m "Uppdatera resultat"
            git pull --rebase --quiet
            git push
          fi
